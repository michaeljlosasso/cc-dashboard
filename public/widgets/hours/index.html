<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ll-green:#00b580; --ll-magenta:#f40070; --ll-purple:#8a56f3;
  --ll-cyan:#00c5ff;  --ll-yellow:#ffd900;  --ll-black:#191718;
  --ll-surface:#f9fafb; --ll-border:#e5e7eb;
  --muted:#6b7280; --dim:#a1a1aa;
  --card-shadow:0 1px 3px rgba(25,23,24,.08), 0 16px 36px rgba(25,23,24,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ll-black);
  background:
    radial-gradient(circle at 14% 0%, rgba(0,197,255,.06), transparent 28%),
    linear-gradient(180deg,#fff 0%, #f9fafb 34%, #f6f7f8 100%);
  min-height:100vh; padding:16px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{
  border:1px solid rgba(229,231,235,.92); background:rgba(255,255,255,.94);
  box-shadow:var(--card-shadow); border-radius:14px; padding:18px;
  animation:fadeUp 260ms ease both;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;color:#0094aa;
  font-family:"Outfit",sans-serif;font-size:.72rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;
}
.card-h{font-family:"Nunito";font-size:1.08rem;font-weight:850;line-height:1.05;margin:0 0 2px}
.card-sub{font-size:.87rem;color:var(--muted);font-weight:700;margin:0}
.filter-bar{
  border:1px solid rgba(229,231,235,.92); border-radius:18px;
  background:rgba(255,255,255,.96); box-shadow:var(--card-shadow);
  padding:12px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  position:relative; z-index:40; animation:fadeUp 260ms ease both;
}
.filter-control{
  display:inline-flex;align-items:center;gap:9px;min-height:40px;
  border:1px solid var(--ll-border);border-radius:999px;background:#fff;
  color:var(--ll-black);font-family:"Nunito",sans-serif;font-size:.93rem;
  font-weight:850;padding:0 16px;box-shadow:0 1px 2px rgba(25,23,24,.04);
  cursor:pointer;transition:border-color 160ms ease,box-shadow 160ms ease;white-space:nowrap;
}
.filter-control:hover,.filter-control[aria-expanded="true"]{
  border-color:rgba(138,86,243,.62); box-shadow:0 7px 18px rgba(138,86,243,.08);
}
.filter-control .chev{transition:transform 160ms ease;color:#9ca3af}
.filter-control[aria-expanded="true"] .chev{transform:rotate(180deg)}
.freshness{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted)}
.pop-wrap{position:relative}
.pop{
  position:absolute;top:calc(100% + 8px);left:0;z-index:60;display:none;
  width:min(340px,calc(100vw - 48px));border:1px solid rgba(229,231,235,.94);
  border-radius:13px;background:#fff;
  box-shadow:0 22px 54px rgba(25,23,24,.14),0 2px 8px rgba(25,23,24,.08);overflow:hidden;
}
.pop.open{display:block}
.pop-list{max-height:340px;overflow:auto;padding:8px}
.pop-item{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
  cursor:pointer;font-size:.9rem;font-weight:750;color:#3f3f46;
  transition:background 140ms ease;
}
.pop-item:hover{background:#f4f4f5}
.pop-item.on{background:rgba(0,197,255,.12);color:#0094aa;font-weight:850}
.pop-item .tag{
  margin-left:auto;font-size:.66rem;font-weight:900;letter-spacing:.06em;
  border-radius:999px;padding:2px 8px;color:#007e5c;background:rgba(0,181,128,.12);
}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.metric-card{position:relative;overflow:hidden}
.metric-card::after{
  content:"";position:absolute;right:-22px;bottom:-38px;width:112px;height:112px;
  border-radius:999px;opacity:.09;background:currentColor;pointer-events:none;
}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between}
.badge{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;background:color-mix(in srgb,currentColor 12%,white);
}
.chip{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:4px 8px;font-size:.72rem;font-weight:850}
.chip.active{color:#007e5c;background:rgba(0,181,128,.10)}
.mc-label{
  font-family:"Nunito";font-size:.82rem;font-weight:850;letter-spacing:.02em;
  text-transform:uppercase;color:var(--muted);margin-top:14px;
}
.mc-value{
  font-family:"Outfit",sans-serif;font-size:clamp(1.65rem,2.4vw,2.35rem);
  font-weight:900;line-height:1;margin-top:2px;
}
.mc-help{font-family:"Nunito";font-size:.87rem;font-weight:700;color:var(--muted);margin-top:6px}
.c-cyan{color:var(--ll-cyan)} .c-green{color:var(--ll-green)}
.c-purple{color:var(--ll-purple)} .c-yellow{color:#d09f00}
.tbl-scroll{overflow:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:.87rem;font-weight:700}
thead th{
  text-align:left;font-size:.7rem;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);padding:0 12px 10px;white-space:nowrap;
}
thead th.r, td.r{text-align:right}
tbody td{padding:11px 12px;border-top:1px solid #f1f2f4;white-space:nowrap}
tbody tr:hover{background:#fafafa}
tfoot td{padding:12px;border-top:2px solid #e5e7eb;font-weight:900}
.mono{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-weight:700;font-size:.78rem}
.agent-name{font-weight:850}
.total-pill{
  display:inline-block;border-radius:999px;padding:4px 12px;font-weight:900;
  color:#007e5c;background:rgba(0,181,128,.10);
}
.zero{color:#d1d5db}
.note{
  border:1px solid rgba(0,197,255,.25);background:rgba(0,197,255,.05);
  border-radius:14px;padding:14px 18px;font-size:.83rem;font-weight:700;color:#1e6b78;
}
.err{
  border:1px solid rgba(244,0,112,.3);background:rgba(244,0,112,.05);color:#b90053;
  border-radius:14px;padding:18px;font-weight:750;
}
.skel{
  background:linear-gradient(90deg,#f1f2f4 25%,#e9eaec 50%,#f1f2f4 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px;
}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="filter-bar">
    <div class="pop-wrap">
      <button class="filter-control" id="wkBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span id="wkLabel">—</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="wkPop"><div class="pop-list" id="wkList"></div></div>
    </div>
    <div class="freshness" id="freshness">Loading…</div>
  </div>
  <div id="content"></div>
</div>

<script>
"use strict";

const HOURLY_RATE = 5.0;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const S = { data:null, err:null, week:null, weeks:[] };

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmt = s => { const d=parse(s); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; };
const money = n => "$" + n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const hrs = n => n.toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});

async function load(){
  try{
    const r = await fetch("/api/data", { cache:"no-store" });
    if(r.status===401){ parent.location.href="/login"; return; }
    const j = await r.json();
    if(!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
    S.data = j;
    buildWeeks();
    const m = S.data.meta;
    if(m && m.last_sync){
      const t = new Date(m.last_sync);
      document.getElementById("freshness").textContent =
        "Data synced " + t.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    }
  }catch(e){ S.err = String(e.message||e); }
  render();
}

function mondayOf(d){ return addDays(d, -((d.getDay()+6)%7)); }

function buildWeeks(){
  const dates = S.data.hours.map(r=>r[1]).sort();
  if(!dates.length) return;
  let m = mondayOf(parse(dates[0]));
  const lastM = mondayOf(new Date());
  const out=[];
  while(m <= lastM){ out.push(iso(m)); m = addDays(m,7); }
  S.weeks = out.reverse();
  // default = previous full week (this coming Monday's payout)
  S.week = S.weeks[1] || S.weeks[0];

  const list = document.getElementById("wkList");
  list.innerHTML = S.weeks.map((w,i)=>{
    const label = `${fmt(w)} – ${fmt(iso(addDays(parse(w),6)))}`;
    const tag = i===0 ? "CURRENT" : (i===1 ? "PAYS MONDAY" : "");
    return `<div class="pop-item${w===S.week?" on":""}" data-w="${w}">
      Week of ${label} ${tag?`<span class="tag">${tag}</span>`:""}
    </div>`;
  }).join("");
  list.querySelectorAll(".pop-item").forEach(el=>{
    el.onclick = ()=>{
      S.week = el.dataset.w;
      list.querySelectorAll(".pop-item").forEach(x=>x.classList.toggle("on",x.dataset.w===S.week));
      closePop(); render();
    };
  });
}

function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function compute(){
  const a = S.week, b = iso(addDays(parse(S.week),6));
  const days = []; for(let i=0;i<7;i++) days.push(iso(addDays(parse(S.week),i)));
  const per = {}; // user -> {byDay:{}, total, calls}
  for(const [u,d,h,calls] of S.data.hours){
    if(d<a || d>b) continue;
    if(!per[u]) per[u] = { byDay:{}, total:0, calls:0 };
    per[u].byDay[d] = (per[u].byDay[d]||0)+h;
    per[u].total += h; per[u].calls += calls;
  }
  const rows = Object.entries(per).map(([u,v])=>({
    user:u, name:S.data.agents[u]||u, ...v, pay:v.total*HOURLY_RATE,
  })).sort((x,y)=>y.total-x.total);
  return { days, rows };
}

function render(){
  const c = document.getElementById("content");
  if(S.week){
    document.getElementById("wkLabel").textContent =
      `Week of ${fmt(S.week)} – ${fmt(iso(addDays(parse(S.week),6)))}`;
  }
  if(S.err){
    c.innerHTML = `<div class="err"><strong>Couldn't load hours data.</strong><br>${esc(S.err)}</div>`;
    return;
  }
  if(!S.data){
    c.innerHTML = `<div class="kpi-row">${'<div class="card skel" style="height:150px"></div>'.repeat(4)}</div>
      <div class="card skel" style="height:280px;margin-top:14px"></div>`;
    return;
  }
  const R = compute();
  c.innerHTML = kpis(R) + tableCard(R) + `<div class="note">
    <strong>How this is calculated:</strong> login hours are the span from an agent's first to last
    VICIdial event each day. Hourly pay = total weekly hours × $5.00, paid every Monday for the
    previous Mon–Sun week. Set/sit bonuses and commission are on the Payroll page (paid Fridays).
  </div>`;
}

function kpis(R){
  const totH = R.rows.reduce((a,x)=>a+x.total,0);
  const totPay = totH * HOURLY_RATE;
  const totCalls = R.rows.reduce((a,x)=>a+x.calls,0);
  const cph = totH>0 ? Math.round(totCalls/totH*10)/10 : 0;

  const ic = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const tile = (cls,icon,label,value,help,chip) => `
    <div class="card metric-card ${cls}">
      <div class="mc-top"><div class="badge">${icon}</div>${chip||""}</div>
      <div class="mc-label">${label}</div>
      <div class="mc-value">${value}</div>
      <div class="mc-help">${help}</div>
    </div>`;

  return `<div class="kpi-row">
    ${tile("c-green", ic('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
      "Monday Payout", money(totPay), `${hrs(totH)} hours × $5.00/hr`,
      '<span class="chip active">↗ Active</span>')}
    ${tile("c-cyan", ic('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
      "Login Hours", hrs(totH), `${R.rows.length} agent${R.rows.length===1?"":"s"} this week`)}
    ${tile("c-purple", ic('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>'),
      "Calls Dialed", totCalls.toLocaleString(), `${cph} calls per login hour`)}
    ${tile("c-yellow", ic('<path d="M12 20V10M18 20V4M6 20v-4"/>'),
      "Avg Per Agent", R.rows.length ? hrs(totH/R.rows.length) : "0.0",
      "hours per agent this week")}
  </div>`;
}

function tableCard(R){
  const head = R.days.map((d,i)=>`<th class="r">${DAYS[i]} <span class="sub">${fmt(d).split(" ")[1]}</span></th>`).join("");
  const rows = R.rows.map(x=>`
    <tr>
      <td class="agent-name">${esc(x.name)} <span class="sub">${esc(x.user)}</span></td>
      ${R.days.map(d=>{
        const v = x.byDay[d];
        return `<td class="r mono${v?"":" zero"}">${v?hrs(v):"—"}</td>`;
      }).join("")}
      <td class="r mono" style="font-weight:900">${hrs(x.total)}</td>
      <td class="r"><span class="total-pill mono">${money(x.pay)}</span></td>
    </tr>`).join("");
  const totByDay = R.days.map(d=>R.rows.reduce((a,x)=>a+(x.byDay[d]||0),0));
  const totH = R.rows.reduce((a,x)=>a+x.total,0);

  return `<div class="card">
    <div class="eyebrow">VICIdial Login Time</div>
    <h2 class="card-h">Hours by Agent — Week of ${fmt(S.week)}</h2>
    <p class="card-sub">Daily login span per agent · paid Monday at $5.00/hr</p>
    <div class="tbl-scroll" style="margin-top:14px">
    <table>
      <thead><tr><th>Agent</th>${head}<th class="r">Total Hrs</th><th class="r">Hourly Pay</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="10" class="sub" style="padding:30px;text-align:center">No hours recorded this week.</td></tr>`}</tbody>
      <tfoot><tr>
        <td>Total</td>
        ${totByDay.map(v=>`<td class="r mono">${v?hrs(v):"—"}</td>`).join("")}
        <td class="r mono">${hrs(totH)}</td>
        <td class="r mono">${money(totH*HOURLY_RATE)}</td>
      </tr></tfoot>
    </table>
    </div>
  </div>`;
}

const wkBtn = document.getElementById("wkBtn");
const wkPop = document.getElementById("wkPop");
function closePop(){ wkPop.classList.remove("open"); wkBtn.setAttribute("aria-expanded","false"); }
wkBtn.onclick = (e)=>{
  e.stopPropagation();
  const open = wkPop.classList.toggle("open");
  wkBtn.setAttribute("aria-expanded", open?"true":"false");
};
document.addEventListener("click", (e)=>{ if(!wkPop.contains(e.target)) closePop(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closePop(); });

load();
</script>
</body>
</html>
