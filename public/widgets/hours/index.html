<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ll-green:#00b580; --ll-magenta:#f40070; --ll-purple:#8a56f3;
  --ll-cyan:#00c5ff;  --ll-yellow:#ffd900;  --ll-black:#191718;
  --ll-surface:#f9fafb; --ll-border:#e5e7eb;
  --muted:#6b7280; --dim:#a1a1aa;
  --card-shadow:0 1px 3px rgba(25,23,24,.08), 0 16px 36px rgba(25,23,24,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ll-black);
  background:
    radial-gradient(circle at 14% 0%, rgba(0,197,255,.06), transparent 28%),
    linear-gradient(180deg,#fff 0%, #f9fafb 34%, #f6f7f8 100%);
  min-height:100vh; padding:16px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{
  border:1px solid rgba(229,231,235,.92); background:rgba(255,255,255,.94);
  box-shadow:var(--card-shadow); border-radius:14px; padding:18px;
  animation:fadeUp 260ms ease both;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;color:#0094aa;
  font-family:"Outfit",sans-serif;font-size:.72rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;
}
.card-h{font-family:"Nunito";font-size:1.08rem;font-weight:850;line-height:1.05;margin:0 0 2px}
.card-sub{font-size:.87rem;color:var(--muted);font-weight:700;margin:0}
.filter-bar{
  border:1px solid rgba(229,231,235,.92); border-radius:18px;
  background:rgba(255,255,255,.96); box-shadow:var(--card-shadow);
  padding:12px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  position:relative; z-index:40; animation:fadeUp 260ms ease both;
}
.filter-control{
  display:inline-flex;align-items:center;gap:9px;min-height:40px;
  border:1px solid var(--ll-border);border-radius:999px;background:#fff;
  color:var(--ll-black);font-family:"Nunito",sans-serif;font-size:.93rem;
  font-weight:850;padding:0 16px;box-shadow:0 1px 2px rgba(25,23,24,.04);
  cursor:pointer;transition:border-color 160ms ease,box-shadow 160ms ease;white-space:nowrap;
}
.filter-control:hover,.filter-control[aria-expanded="true"]{
  border-color:rgba(138,86,243,.62); box-shadow:0 7px 18px rgba(138,86,243,.08);
}
.filter-control .chev{transition:transform 160ms ease;color:#9ca3af}
.filter-control[aria-expanded="true"] .chev{transform:rotate(180deg)}
.freshness{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted)}
/* ---- manual hour adjustments ---- */
.adj{
  position:relative;color:var(--ll-purple)!important;font-weight:900;
  background:rgba(138,86,243,.07);border-radius:6px;cursor:help;
}
.adj::after{
  content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;
  border-radius:50%;background:var(--ll-purple);
}
.adj-legend{
  display:inline-flex;align-items:center;gap:6px;font-size:.78rem;
  font-weight:800;color:var(--ll-purple);margin-left:10px;
}
.adj-legend .dot{width:7px;height:7px;border-radius:50%;background:var(--ll-purple)}
.admin-link{
  background:none;border:none;cursor:pointer;font-family:"Nunito";
  font-size:.78rem;font-weight:800;color:#c7cdd4;padding:0 4px;
}
.admin-link:hover{color:var(--ll-purple)}
.admin-pill{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;
  border:1.5px solid rgba(138,86,243,.4);border-radius:999px;background:#fff;
  color:var(--ll-purple);font-family:"Nunito";font-size:.82rem;font-weight:850;
  padding:0 14px;cursor:pointer;transition:all 140ms ease;
}
.admin-pill:hover{background:rgba(138,86,243,.08)}
.modal-veil{
  position:fixed;inset:0;background:rgba(25,23,24,.35);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:60px 20px;
}
.modal-veil.open{display:flex}
.modal{
  width:min(460px,100%);background:#fff;border-radius:14px;
  box-shadow:0 22px 54px rgba(25,23,24,.2);padding:22px;
  max-height:80vh;overflow:auto;
}
.modal h3{font-family:"Outfit";font-weight:800;font-size:1.05rem;margin:0 0 14px}
.modal label{display:block;font-size:.72rem;font-weight:900;letter-spacing:.06em;
  text-transform:uppercase;color:#9ca3af;margin:12px 0 4px}
.modal input,.modal select{
  width:100%;border:1.5px solid var(--ll-border);border-radius:9px;padding:9px 12px;
  font-family:"Nunito";font-size:.95rem;font-weight:700;outline:none;
}
.modal input:focus,.modal select:focus{border-color:var(--ll-purple)}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.modal button{
  border:none;border-radius:9px;padding:10px 18px;font-family:"Nunito";
  font-weight:900;font-size:.9rem;cursor:pointer;
}
.modal .primary{background:var(--ll-purple);color:#fff}
.modal .ghost{background:#f4f4f5;color:#3f3f46}
.modal .msg{margin-top:12px;font-size:.83rem;font-weight:800;display:none}
.modal .msg.ok{color:#007e5c;display:block}
.modal .msg.bad{color:#b90053;display:block}
.modal .hint{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:6px;line-height:1.45}
.adj-list{margin-top:16px;border-top:1px solid #f1f2f4;padding-top:10px}
.adj-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.85rem;font-weight:700}
.adj-row .del{margin-left:auto;background:none;border:none;color:#b90053;cursor:pointer;font-weight:900;padding:2px 6px}
.pop-wrap{position:relative}
.pop{
  position:absolute;top:calc(100% + 8px);left:0;z-index:60;display:none;
  width:min(340px,calc(100vw - 48px));border:1px solid rgba(229,231,235,.94);
  border-radius:13px;background:#fff;
  box-shadow:0 22px 54px rgba(25,23,24,.14),0 2px 8px rgba(25,23,24,.08);overflow:hidden;
}
.pop.open{display:block}
.pop-list{max-height:340px;overflow:auto;padding:8px}
.pop-item{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
  cursor:pointer;font-size:.9rem;font-weight:750;color:#3f3f46;
  transition:background 140ms ease;
}
.pop-item:hover{background:#f4f4f5}
.pop-item.on{background:rgba(0,197,255,.12);color:#0094aa;font-weight:850}
.pop-item .tag{
  margin-left:auto;font-size:.66rem;font-weight:900;letter-spacing:.06em;
  border-radius:999px;padding:2px 8px;color:#007e5c;background:rgba(0,181,128,.12);
}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.metric-card{position:relative;overflow:hidden}
.metric-card::after{
  content:"";position:absolute;right:-22px;bottom:-38px;width:112px;height:112px;
  border-radius:999px;opacity:.09;background:currentColor;pointer-events:none;
}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between}
.badge{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;background:color-mix(in srgb,currentColor 12%,white);
}
.chip{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:4px 8px;font-size:.72rem;font-weight:850}
.chip.active{color:#007e5c;background:rgba(0,181,128,.10)}
.mc-label{
  font-family:"Nunito";font-size:.82rem;font-weight:850;letter-spacing:.02em;
  text-transform:uppercase;color:var(--muted);margin-top:14px;
}
.mc-value{
  font-family:"Outfit",sans-serif;font-size:clamp(1.65rem,2.4vw,2.35rem);
  font-weight:900;line-height:1;margin-top:2px;
}
.mc-help{font-family:"Nunito";font-size:.87rem;font-weight:700;color:var(--muted);margin-top:6px}
.c-cyan{color:var(--ll-cyan)} .c-green{color:var(--ll-green)}
.c-purple{color:var(--ll-purple)} .c-yellow{color:#d09f00}
.tbl-scroll{overflow:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:.87rem;font-weight:700}
thead th{
  text-align:left;font-size:.7rem;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);padding:0 12px 10px;white-space:nowrap;
}
thead th.r, td.r{text-align:right}
tbody td{padding:11px 12px;border-top:1px solid #f1f2f4;white-space:nowrap}
tbody tr:hover{background:#fafafa}
tfoot td{padding:12px;border-top:2px solid #e5e7eb;font-weight:900}
.mono{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-weight:700;font-size:.78rem}
.agent-name{font-weight:850}
.total-pill{
  display:inline-block;border-radius:999px;padding:4px 12px;font-weight:900;
  color:#007e5c;background:rgba(0,181,128,.10);
}
.zero{color:#d1d5db}
.note{
  border:1px solid rgba(0,197,255,.25);background:rgba(0,197,255,.05);
  border-radius:14px;padding:14px 18px;font-size:.83rem;font-weight:700;color:#1e6b78;
}
.err{
  border:1px solid rgba(244,0,112,.3);background:rgba(244,0,112,.05);color:#b90053;
  border-radius:14px;padding:18px;font-weight:750;
}
.skel{
  background:linear-gradient(90deg,#f1f2f4 25%,#e9eaec 50%,#f1f2f4 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px;
}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="filter-bar">
    <div class="pop-wrap">
      <button class="filter-control" id="wkBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span id="wkLabel">—</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="wkPop"><div class="pop-list" id="wkList"></div></div>
    </div>
    <div class="freshness" id="freshness">Loading…</div>
    <span id="adminControls" style="display:none">
      <button class="admin-pill" id="adjBtn">+ Adjust Hours</button>
    </span>
    <button class="admin-link" id="adminLink" title="Admin">Admin</button>
  </div>
  <div id="content"></div>
</div>

<!-- admin: manual hour adjustment -->
<div class="modal-veil" id="adjVeil">
  <div class="modal">
    <h3>Adjust Hours</h3>
    <label>Agent</label>
    <select id="ajAgent"></select>
    <div class="row2">
      <div><label>Date</label><input id="ajDate" type="date" /></div>
      <div><label>Hours</label><input id="ajHours" type="number" min="0" max="24" step="0.25" placeholder="8" /></div>
    </div>
    <label>Mode</label>
    <select id="ajMode">
      <option value="set">Set — pay exactly this, ignore logged time</option>
      <option value="add">Add — on top of whatever was logged</option>
    </select>
    <p class="hint" id="ajHint"></p>
    <label>Reason</label>
    <input id="ajNote" placeholder="Labor Day — flat holiday shift" />
    <div class="btns">
      <button class="ghost" data-close>Cancel</button>
      <button class="primary" id="ajSave">Save Adjustment</button>
    </div>
    <div class="msg" id="ajMsg"></div>
    <div class="adj-list" id="adjList"></div>
  </div>
</div>

<script>
"use strict";

const HOURLY_RATE = 5.0;
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const S = { data:null, err:null, week:null, weeks:[] };

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmt = s => { const d=parse(s); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; };
const money = n => "$" + n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const hrs = n => n.toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});

async function load(){
  try{
    const r = await fetch("/api/data", { cache:"no-store" });
    if(r.status===401){ parent.location.href="/login"; return; }
    const j = await r.json();
    if(!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
    S.data = j;
    buildWeeks();
    const m = S.data.meta;
    if(m && m.last_sync){
      const t = new Date(m.last_sync);
      document.getElementById("freshness").textContent =
        "Data synced " + t.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    }
  }catch(e){ S.err = String(e.message||e); }
  render();
}

function mondayOf(d){ return addDays(d, -((d.getDay()+6)%7)); }

function buildWeeks(){
  const dates = S.data.hours.map(r=>r[1]).sort();
  if(!dates.length) return;
  let m = mondayOf(parse(dates[0]));
  const lastM = mondayOf(new Date());
  const out=[];
  while(m <= lastM){ out.push(iso(m)); m = addDays(m,7); }
  S.weeks = out.reverse();
  // default = previous full week (this coming Monday's payout)
  S.week = S.weeks[1] || S.weeks[0];

  const list = document.getElementById("wkList");
  list.innerHTML = S.weeks.map((w,i)=>{
    const label = `${fmt(w)} – ${fmt(iso(addDays(parse(w),6)))}`;
    const tag = i===0 ? "CURRENT" : (i===1 ? "PAYS MONDAY" : "");
    return `<div class="pop-item${w===S.week?" on":""}" data-w="${w}">
      Week of ${label} ${tag?`<span class="tag">${tag}</span>`:""}
    </div>`;
  }).join("");
  list.querySelectorAll(".pop-item").forEach(el=>{
    el.onclick = ()=>{
      S.week = el.dataset.w;
      list.querySelectorAll(".pop-item").forEach(x=>x.classList.toggle("on",x.dataset.w===S.week));
      closePop(); render();
    };
  });
}

function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function compute(){
  const a = S.week, b = iso(addDays(parse(S.week),6));
  const days = []; for(let i=0;i<7;i++) days.push(iso(addDays(parse(S.week),i)));
  const per = {}; // user -> {byDay:{}, adjDay:{}, total, calls, adjCount}
  // h is the PAID number — the Worker already applied any adjustment. adjusted
  // and logged tell us whether to flag the cell and what it really was.
  for(const [u,d,h,calls,adjusted,logged,note] of S.data.hours){
    if(d<a || d>b) continue;
    if(!per[u]) per[u] = { byDay:{}, adjDay:{}, total:0, calls:0, adjCount:0 };
    per[u].byDay[d] = (per[u].byDay[d]||0)+h;
    if(adjusted){
      per[u].adjDay[d] = { logged: logged||0, note: note||"" };
      per[u].adjCount++;
    }
    per[u].total += h; per[u].calls += calls;
  }
  const rows = Object.entries(per).map(([u,v])=>({
    user:u, name:S.data.agents[u]||u, ...v, pay:v.total*HOURLY_RATE,
  })).sort((x,y)=>y.total-x.total);
  return { days, rows, anyAdj: rows.some(r=>r.adjCount>0) };
}

function render(){
  const c = document.getElementById("content");
  if(S.week){
    document.getElementById("wkLabel").textContent =
      `Week of ${fmt(S.week)} – ${fmt(iso(addDays(parse(S.week),6)))}`;
  }
  if(S.err){
    c.innerHTML = `<div class="err"><strong>Couldn't load hours data.</strong><br>${esc(S.err)}</div>`;
    return;
  }
  if(!S.data){
    c.innerHTML = `<div class="kpi-row">${'<div class="card skel" style="height:150px"></div>'.repeat(4)}</div>
      <div class="card skel" style="height:280px;margin-top:14px"></div>`;
    return;
  }
  const R = compute();
  c.innerHTML = kpis(R) + tableCard(R) + breaksCard(R);
}

function breaksCard(R){
  const a = S.week, b = iso(addDays(parse(S.week),6));
  const per = {}; // user -> {LUNCH, BRK, ADMIN, OTHER, total}
  for(const [u,d,code,h] of (S.data.breaks||[])){
    if(d<a || d>b) continue;
    if(!per[u]) per[u] = {LUNCH:0, BRK:0, ADMIN:0, OTHER:0, total:0};
    per[u][code] = (per[u][code]||0)+h;
    per[u].total += h;
  }
  const worked = {}; for(const x of R.rows) worked[x.user] = x.total;
  const users = Object.keys(per).sort((x,y)=>(per[y].total)-(per[x].total));
  if(!users.length) return "";

  const rows = users.map(u=>{
    const p = per[u], w = worked[u]||0;
    const pct = w>0 ? Math.round(p.total/w*100) : 0;
    const cell = v => v>=0.05 ? hrs(v) : "—";
    return `<tr>
      <td class="agent-name">${esc(S.data.agents[u]||u)} <span class="sub">${esc(u)}</span></td>
      <td class="r mono">${cell(p.LUNCH)}</td>
      <td class="r mono">${cell(p.BRK)}</td>
      <td class="r mono">${cell(p.ADMIN)}</td>
      <td class="r mono">${cell(p.OTHER)}</td>
      <td class="r mono" style="font-weight:900">${hrs(p.total)}</td>
      <td class="r mono">${w?hrs(w):"—"}</td>
      <td class="r mono${pct>=35?" sub":""}" style="${pct>=35?"color:#b90053;font-weight:900":""}">${w?pct+"%":"—"}</td>
    </tr>`;
  }).join("");

  const t = {L:0,B:0,A:0,O:0,tot:0,w:0};
  users.forEach(u=>{const p=per[u]; t.L+=p.LUNCH; t.B+=p.BRK; t.A+=p.ADMIN; t.O+=p.OTHER; t.tot+=p.total; t.w+=(worked[u]||0);});

  return `<div class="card">
    <div class="eyebrow" style="color:#8a56f3">Break Time</div>
    <h2 class="card-h">Breaks by Agent — Week of ${fmt(S.week)}</h2>
    <p class="card-sub">Paused time by code · breaks are paid, logged-out time is not</p>
    <div class="tbl-scroll" style="margin-top:14px">
    <table>
      <thead><tr>
        <th>Agent</th><th class="r">Lunch</th><th class="r">Break</th><th class="r">Admin</th>
        <th class="r">Other</th><th class="r">Total Breaks</th><th class="r">Hours Worked</th><th class="r">Break %</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td>Total</td>
        <td class="r mono">${hrs(t.L)}</td><td class="r mono">${hrs(t.B)}</td>
        <td class="r mono">${hrs(t.A)}</td><td class="r mono">${hrs(t.O)}</td>
        <td class="r mono">${hrs(t.tot)}</td><td class="r mono">${hrs(t.w)}</td>
        <td class="r mono">${t.w>0?Math.round(t.tot/t.w*100)+"%":"—"}</td>
      </tr></tfoot>
    </table>
    </div>
  </div>`;
}

function kpis(R){
  const totH = R.rows.reduce((a,x)=>a+x.total,0);
  const totPay = totH * HOURLY_RATE;
  const totCalls = R.rows.reduce((a,x)=>a+x.calls,0);
  const cph = totH>0 ? Math.round(totCalls/totH*10)/10 : 0;

  const ic = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const tile = (cls,icon,label,value,help,chip) => `
    <div class="card metric-card ${cls}">
      <div class="mc-top"><div class="badge">${icon}</div>${chip||""}</div>
      <div class="mc-label">${label}</div>
      <div class="mc-value">${value}</div>
      <div class="mc-help">${help}</div>
    </div>`;

  return `<div class="kpi-row">
    ${tile("c-cyan", ic('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'),
      "Login Hours", hrs(totH), `${R.rows.length} agent${R.rows.length===1?"":"s"} this week`,
      '<span class="chip active">↗ Active</span>')}
    ${tile("c-purple", ic('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>'),
      "Calls Dialed", totCalls.toLocaleString(), `${cph} calls per login hour`)}
    ${tile("c-yellow", ic('<path d="M12 20V10M18 20V4M6 20v-4"/>'),
      "Avg Per Agent", R.rows.length ? hrs(totH/R.rows.length) : "0.0",
      "hours per agent this week")}
  </div>`;
}

function tableCard(R){
  const head = R.days.map((d,i)=>`<th class="r">${DAYS[i]} <span class="sub">${fmt(d).split(" ")[1]}</span></th>`).join("");
  const rows = R.rows.map(x=>`
    <tr>
      <td class="agent-name">${esc(x.name)} <span class="sub">${esc(x.user)}</span></td>
      ${R.days.map(d=>{
        const v = x.byDay[d], aj = x.adjDay[d];
        if(!aj) return `<td class="r mono${v?"":" zero"}">${v?hrs(v):"—"}</td>`;
        const tip = `Manually adjusted${aj.note?" — "+aj.note:""}`
          + ` · VICIdial logged ${hrs(aj.logged)} hr`;
        return `<td class="r mono adj" title="${esc(tip)}">${hrs(v||0)}</td>`;
      }).join("")}
      <td class="r mono" style="font-weight:900">${hrs(x.total)}</td>
    </tr>`).join("");
  const totByDay = R.days.map(d=>R.rows.reduce((a,x)=>a+(x.byDay[d]||0),0));
  const totH = R.rows.reduce((a,x)=>a+x.total,0);

  return `<div class="card">
    <div class="eyebrow">VICIdial Login Time</div>
    <h2 class="card-h">Hours by Agent — Week of ${fmt(S.week)}</h2>
    <p class="card-sub">Daily login span per agent${R.anyAdj
      ? `<span class="adj-legend"><span class="dot"></span>manually adjusted — hover for the reason</span>`
      : ""}</p>
    <div class="tbl-scroll" style="margin-top:14px">
    <table>
      <thead><tr><th>Agent</th>${head}<th class="r">Total Hrs</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="9" class="sub" style="padding:30px;text-align:center">No hours recorded this week.</td></tr>`}</tbody>
      <tfoot><tr>
        <td>Total</td>
        ${totByDay.map(v=>`<td class="r mono">${v?hrs(v):"—"}</td>`).join("")}
        <td class="r mono">${hrs(totH)}</td>
      </tr></tfoot>
    </table>
    </div>
  </div>`;
}

const wkBtn = document.getElementById("wkBtn");
const wkPop = document.getElementById("wkPop");
function closePop(){ wkPop.classList.remove("open"); wkBtn.setAttribute("aria-expanded","false"); }
wkBtn.onclick = (e)=>{
  e.stopPropagation();
  const open = wkPop.classList.toggle("open");
  wkBtn.setAttribute("aria-expanded", open?"true":"false");
};
document.addEventListener("click", (e)=>{ if(!wkPop.contains(e.target)) closePop(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closePop(); });

/* ------------------------------------------------------------------ admin */
const A = { pc: sessionStorage.getItem("cc_admin_pc") || "" };

function showAdminControls(){
  document.getElementById("adminControls").style.display = A.pc ? "inline-flex" : "none";
  document.getElementById("adminLink").textContent = A.pc ? "Lock" : "Admin";
}
showAdminControls();

document.getElementById("adminLink").onclick = ()=>{
  if(A.pc){ A.pc=""; sessionStorage.removeItem("cc_admin_pc"); showAdminControls(); return; }
  const pc = prompt("Admin passcode:");
  if(!pc) return;
  A.pc = pc; sessionStorage.setItem("cc_admin_pc", pc); showAdminControls();
};

function closeVeils(){ document.querySelectorAll(".modal-veil").forEach(v=>v.classList.remove("open")); }
document.querySelectorAll("[data-close]").forEach(b=> b.onclick = closeVeils);
document.querySelectorAll(".modal-veil").forEach(v=> v.addEventListener("click", e=>{ if(e.target===v) closeVeils(); }));

async function adminPost(path, payload, msgEl){
  const el = document.getElementById(msgEl);
  el.className = "msg";
  const r = await fetch(path, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ admin: A.pc, ...payload }),
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok || j.error){
    el.textContent = j.error || `HTTP ${r.status}`; el.className = "msg bad";
    return false;
  }
  return true;
}

async function reloadData(){
  const r = await fetch("/api/data?refresh=1", { cache:"no-store" });
  const j = await r.json();
  if(r.ok && !j.error){ S.data = j; render(); }
}

/* ---- adjustment dialog ---- */
// Every adjusted day in the dataset, newest first — the Worker flags them on
// the hours rows, so we don't need a second endpoint just to list them.
function adjustments(){
  return (S.data && S.data.hours || [])
    .filter(r => r[4])
    .map(r => ({ user:r[0], date:r[1], paid:r[2], logged:r[5], note:r[6] }))
    .sort((a,b)=> b.date.localeCompare(a.date));
}

function renderAdjList(){
  const list = document.getElementById("adjList");
  const rows = adjustments().slice(0, 12);
  list.innerHTML = rows.length
    ? "<label>Recent adjustments</label>" + rows.map(a=>`
        <div class="adj-row">
          <span>${esc(fmt(a.date))}</span>
          <span style="font-weight:850">${esc((S.data.agents||{})[a.user]||a.user)}</span>
          <span class="mono">${hrs(a.paid)} hr</span>
          <span class="sub">${esc(a.note || "—")}</span>
          <button class="del" data-u="${esc(a.user)}" data-d="${esc(a.date)}" title="Remove">×</button>
        </div>`).join("")
    : "<label>Recent adjustments</label><div class=\"sub\" style=\"font-size:.83rem;font-weight:700\">None yet.</div>";
  list.querySelectorAll(".del").forEach(b=> b.onclick = async ()=>{
    if(!confirm("Remove this adjustment? The day reverts to VICIdial logged time.")) return;
    if(await adminPost("/api/hours-adjust/delete",
        { user:b.dataset.u, work_date:b.dataset.d }, "ajMsg")){
      await reloadData(); renderAdjList();
    }
  });
}

// Shows what the agent actually logged that day, so "set 8" on a day they
// worked 5.5 is an informed choice rather than a silent overwrite.
function updateAjHint(){
  const u = document.getElementById("ajAgent").value;
  const d = document.getElementById("ajDate").value;
  const mode = document.getElementById("ajMode").value;
  const h = Number(document.getElementById("ajHours").value) || 0;
  const el = document.getElementById("ajHint");
  if(!u || !d){ el.textContent = ""; return; }
  const row = (S.data.hours||[]).find(r=> r[0]===u && r[1]===d);
  const logged = row ? (row[4] ? row[5] : row[2]) : 0;
  const result = mode === "add" ? logged + h : h;
  el.innerHTML = `VICIdial logged <strong>${hrs(logged)} hr</strong> that day. `
    + `This agent will be paid for <strong>${hrs(result)} hr</strong>.`;
}

document.getElementById("adjBtn").onclick = ()=>{
  const sel = document.getElementById("ajAgent");
  sel.innerHTML = Object.entries(S.data.agents||{})
    .map(([u,n])=>`<option value="${esc(u)}">${esc(n)}</option>`).join("");
  document.getElementById("ajDate").value = iso(new Date());
  document.getElementById("ajMsg").className = "msg";
  updateAjHint(); renderAdjList();
  document.getElementById("adjVeil").classList.add("open");
};

["ajAgent","ajDate","ajMode","ajHours"].forEach(id=>{
  document.getElementById(id).addEventListener("input", updateAjHint);
});

document.getElementById("ajSave").onclick = async ()=>{
  const ok = await adminPost("/api/hours-adjust", {
    user: document.getElementById("ajAgent").value,
    work_date: document.getElementById("ajDate").value,
    mode: document.getElementById("ajMode").value,
    hours: Number(document.getElementById("ajHours").value),
    note: document.getElementById("ajNote").value,
  }, "ajMsg");
  if(ok){
    const el = document.getElementById("ajMsg");
    el.textContent = "Adjustment saved."; el.className = "msg ok";
    await reloadData(); renderAdjList(); updateAjHint();
  }
};

load();
</script>
