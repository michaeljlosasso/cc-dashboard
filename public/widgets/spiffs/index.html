<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spiffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ll-green:#00b580; --ll-magenta:#f40070; --ll-purple:#8a56f3;
  --ll-cyan:#00c5ff;  --ll-yellow:#ffd900;  --ll-black:#191718;
  --ll-surface:#f9fafb; --ll-border:#e5e7eb;
  --muted:#6b7280; --dim:#a1a1aa;
  --card-shadow:0 1px 3px rgba(25,23,24,.08), 0 16px 36px rgba(25,23,24,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ll-black);
  background:
    radial-gradient(circle at 14% 0%, rgba(0,197,255,.06), transparent 28%),
    linear-gradient(180deg,#fff 0%, #f9fafb 34%, #f6f7f8 100%);
  min-height:100vh; padding:16px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{
  border:1px solid rgba(229,231,235,.92); background:rgba(255,255,255,.94);
  box-shadow:var(--card-shadow); border-radius:14px; padding:20px;
  animation:fadeUp 260ms ease both;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;color:#0094aa;
  font-family:"Outfit",sans-serif;font-size:.72rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;
}
.card-h{font-family:"Nunito";font-size:1.08rem;font-weight:850;line-height:1.05;margin:0 0 2px}
.card-sub{font-size:.87rem;color:var(--muted);font-weight:700;margin:0}
.filter-bar{
  border:1px solid rgba(229,231,235,.92); border-radius:18px;
  background:rgba(255,255,255,.96); box-shadow:var(--card-shadow);
  padding:12px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  animation:fadeUp 260ms ease both;
}
.freshness{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted)}
.admin-btn{
  display:inline-flex;align-items:center;gap:7px;min-height:38px;
  border:1px solid var(--ll-border);border-radius:999px;background:#fff;
  font-family:"Nunito";font-weight:850;font-size:.86rem;padding:0 14px;cursor:pointer;
  color:var(--ll-black);
}
.admin-btn:hover{border-color:rgba(138,86,243,.62)}
.admin-btn.on{background:var(--ll-purple);border-color:var(--ll-purple);color:#fff}

.metric-card{position:relative;overflow:hidden}
.metric-card::after{
  content:"";position:absolute;right:-22px;bottom:-38px;width:112px;height:112px;
  border-radius:999px;opacity:.09;background:currentColor;pointer-events:none;
}
.badge{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;background:color-mix(in srgb,currentColor 12%,white);
}
.mc-label{font-family:"Nunito";font-size:.82rem;font-weight:850;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.mc-value{font-family:"Outfit",sans-serif;font-size:clamp(1.5rem,2.4vw,2.1rem);font-weight:900;line-height:1;margin-top:2px}
.mc-help{font-family:"Nunito";font-size:.87rem;font-weight:700;color:var(--muted);margin-top:6px}
.c-green{color:var(--ll-green)} .c-dim{color:#9ca3af} .c-purple{color:var(--ll-purple)}

/* windows list */
.tbl-scroll{overflow:auto;margin:0 -20px;padding:0 20px}
table{border-collapse:collapse;width:100%;font-size:.87rem;font-weight:700}
thead th{text-align:left;font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:0 12px 10px;white-space:nowrap}
thead th.r,td.r{text-align:right}
tbody td{padding:11px 12px;border-top:1px solid #f1f2f4;white-space:nowrap;vertical-align:top}
tbody tr:hover{background:#fafafa}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:850}
.p-live{color:#007e5c;background:rgba(0,181,128,.10)}
.p-past{color:#6b7280;background:#f1f2f4}
.p-future{color:#5b34c4;background:rgba(138,86,243,.12)}
.kind{font-weight:850}
.sub{color:var(--muted);font-weight:700;font-size:.78rem}
.del{background:none;border:none;color:#b90053;cursor:pointer;font-weight:900;padding:2px 6px;font-family:"Nunito"}
.del:disabled{opacity:.3;cursor:default}

/* add form */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.form label{display:block;font-size:.78rem;font-weight:850;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.form input,.form select{
  width:100%;border:1px solid var(--ll-border);border-radius:9px;padding:9px 11px;
  font-family:"Nunito";font-weight:800;font-size:.92rem;background:#fff;
}
.form input:focus,.form select:focus{outline:2px solid rgba(138,86,243,.35);outline-offset:1px}
.form-actions{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{
  border:1px solid var(--ll-border);background:#fff;border-radius:9px;padding:9px 16px;
  font-family:"Nunito";font-weight:850;font-size:.9rem;cursor:pointer;color:var(--ll-black);
}
.btn.pri{background:var(--ll-purple);border-color:var(--ll-purple);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:.84rem;font-weight:800;color:var(--muted)}
.msg.bad{color:#b90053} .msg.ok{color:#007e5c}
.locked{color:var(--muted);font-weight:700;font-size:.9rem;padding:22px 0;text-align:center}
.err{border:1px solid rgba(244,0,112,.3);background:rgba(244,0,112,.05);color:#b90053;border-radius:14px;padding:18px;font-weight:750}
.skel{background:linear-gradient(90deg,#f1f2f4 25%,#e9eaec 50%,#f1f2f4 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---- month picker (matches Hours/Commission) ---- */
.filter-bar{position:relative;z-index:40}
.filter-control{
  display:inline-flex;align-items:center;gap:9px;min-height:40px;
  border:1px solid var(--ll-border);border-radius:999px;background:#fff;
  color:var(--ll-black);font-family:"Nunito",sans-serif;font-size:.93rem;
  font-weight:850;padding:0 16px;box-shadow:0 1px 2px rgba(25,23,24,.04);
  cursor:pointer;transition:border-color 160ms ease,box-shadow 160ms ease;white-space:nowrap;
}
.filter-control:hover,.filter-control[aria-expanded="true"]{
  border-color:rgba(138,86,243,.62); box-shadow:0 7px 18px rgba(138,86,243,.08);
}
.filter-control .chev{transition:transform 160ms ease;color:#9ca3af}
.filter-control[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pop-wrap{position:relative}
.pop{
  position:absolute;top:calc(100% + 8px);left:0;z-index:60;display:none;
  width:min(300px,calc(100vw - 48px));border:1px solid rgba(229,231,235,.94);
  border-radius:13px;background:#fff;
  box-shadow:0 22px 54px rgba(25,23,24,.14),0 2px 8px rgba(25,23,24,.08);overflow:hidden;
}
.pop.open{display:block}
.pop-list{max-height:340px;overflow:auto;padding:8px}
.pop-item{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
  cursor:pointer;font-size:.9rem;font-weight:750;color:#3f3f46;transition:background 140ms ease;
}
.pop-item:hover{background:#f4f4f5}
.pop-item.on{background:rgba(0,197,255,.12);color:#0094aa;font-weight:850}
.pop-item .tag{
  margin-left:auto;font-size:.66rem;font-weight:900;letter-spacing:.06em;
  border-radius:999px;padding:2px 8px;color:#007e5c;background:rgba(0,181,128,.12);
}
/* ---- tracker ---- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:4px 8px;font-size:.72rem;font-weight:850}
.chip.live{color:#007e5c;background:rgba(0,181,128,.10)}
.c-yellow{color:#c9a400} .c-cyan{color:#00a6d6}
.mono{font-variant-numeric:tabular-nums}
.agent-name{font-weight:850}
th .fri{display:block;font-size:.62rem;letter-spacing:.06em;margin-top:3px;font-weight:900}
th .fri.off{color:#c7cdd4} th .fri.up{color:var(--ll-purple)} th .fri.on{color:#00a37a}
td.zero{color:#c7cdd4}
td .n{color:var(--muted);font-size:.74rem;font-weight:800;margin-left:4px}
.total-pill{
  display:inline-block;min-width:76px;text-align:center;border-radius:999px;padding:5px 12px;
  font-family:"Outfit",sans-serif;font-weight:900;font-size:.95rem;
  color:#007e5c;background:rgba(0,181,128,.12);
}
.total-pill.zero{color:#9ca3af;background:#f1f2f4}
tfoot td{padding:12px;border-top:2px solid #e5e7eb;font-weight:900;white-space:nowrap}
  display:flex;gap:10px;align-items:flex-start;font-size:.84rem;font-weight:700;color:var(--muted);
  background:rgba(0,197,255,.06);border:1px solid rgba(0,197,255,.18);border-radius:12px;padding:12px 14px;margin-top:14px;
}
.empty{color:var(--muted);font-weight:700;padding:26px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="filter-bar">
    <div class="pop-wrap">
      <button class="filter-control" id="moBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span id="moLabel">—</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="moPop"><div class="pop-list" id="moList"></div></div>
    </div>
    <div class="freshness" id="freshness">Loading…</div>
    <button class="admin-btn" id="adminBtn">Admin</button>
  </div>
  <div id="content"></div>
</div>

<script>
"use strict";

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const KINDS = { same_next: "Same / next-day appointment" };
const S = { data:null, err:null, month:null, months:[] };
const A = { pc: sessionStorage.getItem("cc_admin_pc") || "" };

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const fmt = s => { const d=parse(s); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; };
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$" + Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});

async function load(){
  try{
    const r = await fetch("/api/data", { cache:"no-store" });
    if(r.status===401){ parent.location.href="/login"; return; }
    const j = await r.json();
    if(!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
    S.data = j;
    const m = j.meta;
    if(m && m.last_sync){
      const t = new Date(m.last_sync);
      document.getElementById("freshness").textContent =
        "Data synced " + t.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    }
  }catch(e){ S.err = String(e.message||e); }
  render();
}

async function reload(){
  const r = await fetch("/api/data?refresh=1", { cache:"no-store" });
  const j = await r.json();
  if(r.ok && !j.error){ S.data = j; render(); }
}

/* ---------------------------------------------------------------- render */
function render(){
  const c = document.getElementById("content");
  document.getElementById("adminBtn").classList.toggle("on", !!A.pc);
  document.getElementById("adminBtn").textContent = A.pc ? "Admin ✓" : "Admin";
  if(S.err){ c.innerHTML = `<div class="err"><strong>Couldn't load spiffs.</strong><br>${esc(S.err)}</div>`; return; }
  if(!S.data){ c.innerHTML = `<div class="card skel" style="height:150px"></div><div class="card skel" style="height:260px;margin-top:14px"></div>`; return; }
  if(!S.months.length) buildMonths();
  c.innerHTML = trackerKpis() + trackerCard() + windowsCard();
  wire();
}

/* ------------------------------------------------------- spiff tracker ----
 * One question per agent: "what did spiffs pay me this month?"
 *
 * A month = the Friday paydays that fall inside it. That matches the deposits
 * agents actually see, every Friday belongs to exactly one month, and nothing
 * is split. Months with five Fridays will read bigger; the tiles say how many
 * Fridays a month had so that's never a surprise.
 *
 * The per-Friday amount MUST equal the Spiff $ column on the Commission tab.
 * The three helpers below are copied from widgets/payroll — buckets(),
 * spiffCounts(), and the window/manual-spiff rules in compute(). If you change
 * how spiffs pay there, change it here too.
 */
const A_DATE = 0, A_USER = 1, A_CAMPAIGN = 2, A_APPT_AT = 10;
const isTransfer = (campaign) => /transfer/i.test(campaign || "");

function setsWeekFor(fridayIso){          // the week a Friday pays: Mon–Sun before it
  const f = parse(fridayIso);
  const monThis = addDays(f, -((f.getDay()+6)%7));
  return [iso(addDays(monThis,-7)), iso(addDays(monThis,-1))];
}
function spiffForFriday(fridayIso){
  const [a,b] = setsWeekFor(fridayIso);
  const win = (S.data.spiff_windows||[]).find(w => w[1]==="same_next" && w[2] <= b && w[3] >= a);
  const per = {};  // user -> {n, amt}
  if(win){
    for(const r of S.data.appts){
      const d = r[A_DATE]; if(!d || d < a || d > b) continue;
      const u = r[A_USER], at = r[A_APPT_AT];
      if(!u || !at || isTransfer(r[A_CAMPAIGN])) continue;
      const days = Math.round((parse(at.slice(0,10)) - parse(d)) / 86400000);
      if(days === 0 || days === 1){
        per[u] = per[u] || {n:0, amt:0};
        per[u].n += 1; per[u].amt += win[4];
      }
    }
  }
  let manual = false;
  for(const [id,u,amt,note,d] of (S.data.spiffs||[])){
    if(d >= a && d <= b){
      per[u] = per[u] || {n:0, amt:0};
      per[u].amt += amt; manual = true;
      // Hand-entered same/next spiffs record their count in the note
      // ("... — 18 appts (wk Jul 27)"). Use it when present; other manual
      // spiffs (contests etc.) have no count and add $ only.
      const m = String(note||"").match(/(\d+)\s+appts?\b/i);
      if(m) per[u].n += Number(m[1]);
    }
  }
  // Hand-entered spiff notes read like "Same/next-day bonus — 18 appts (wk Jul 27)";
  // the part before " — " is the description, the rest is per-agent detail.
  const manualNotes = [...new Set((S.data.spiffs||[])
    .filter(sp => sp[4] >= a && sp[4] <= b).map(sp => String(sp[3]||"").split(" — ")[0].trim()).filter(Boolean))];
  return { per, win, manual, manualNotes, setsWeek:[a,b], on: !!win || manual };
}
function fridaysIn(ym){
  const [y,m] = ym.split("-").map(Number); const out = [];
  for(let d = new Date(y,m-1,1); d.getMonth() === m-1; d = addDays(d,1))
    if(d.getDay() === 5) out.push(iso(d));
  return out;
}
const ymOf = d => iso(d).slice(0,7);
const monthLabel = ym => { const [y,m] = ym.split("-").map(Number); return `${MONTHS[m-1]} ${y}`; };

function buildMonths(){
  // From the first spiff payday through this month — or later, if a spiff
  // week is already scheduled whose payday lands in a future month.
  let last = ymOf(new Date());
  for(const w of (S.data.spiff_windows||[])){
    const payFri = addDays(mondayOf(parse(w[3])), 11);   // Fri after the window's week
    if(ymOf(payFri) > last) last = ymOf(payFri);
  }
  // First month = the earliest payday that ever paid a spiff, from either a
  // spiff window or a hand-entered spiff. (Aug 2026 had hand-entered ones.)
  let first = last;
  for(const w of (S.data.spiff_windows||[])){
    const m = ymOf(addDays(mondayOf(parse(w[3])), 11)); if(m < first) first = m;
  }
  for(const sp of (S.data.spiffs||[])){
    const m = ymOf(addDays(mondayOf(parse(sp[4])), 11)); if(m < first) first = m;
  }
  const out = [];
  for(let d = parse(first + "-01"); ymOf(d) <= last; d = new Date(d.getFullYear(), d.getMonth()+1, 1))
    out.push(ymOf(d));
  S.months = out.reverse();
  const cur = ymOf(new Date());
  S.month = S.months.includes(cur) ? cur : S.months[0];
  const prev = ymOf(new Date(new Date().getFullYear(), new Date().getMonth()-1, 1));
  document.getElementById("moList").innerHTML = S.months.map(ym => {
    const tag = ym === cur ? "THIS MONTH" : ym === prev ? "LAST MONTH" : "";
    return `<div class="pop-item${ym===S.month?" on":""}" data-m="${ym}">${monthLabel(ym)}${tag?`<span class="tag">${tag}</span>`:""}</div>`;
  }).join("");
  document.querySelectorAll("#moList .pop-item").forEach(el => el.onclick = () => {
    S.month = el.dataset.m;
    document.querySelectorAll("#moList .pop-item").forEach(x => x.classList.toggle("on", x.dataset.m === S.month));
    closePop(); render();
  });
}

function monthData(ym){
  const today = iso(new Date());
  const fris = fridaysIn(ym).map(f => ({ date:f, upcoming: f > today, ...spiffForFriday(f) }));
  const tot = {};   // user -> {n, amt}
  for(const f of fris) for(const [u,v] of Object.entries(f.per)){
    tot[u] = tot[u] || {n:0, amt:0}; tot[u].n += v.n; tot[u].amt += v.amt;
  }
  // Show everyone who booked anything in the month's pay weeks, so a $0 is
  // visible as a $0 rather than silently missing.
  const users = new Set(Object.keys(tot));
  if(fris.length){
    const a = fris[0].setsWeek[0], b = fris[fris.length-1].setsWeek[1];
    for(const r of S.data.appts) if(r[A_USER] && r[A_DATE] >= a && r[A_DATE] <= b) users.add(r[A_USER]);
  }
  const rows = [...users].map(u => ({ user:u, name:(S.data.agents||{})[u] || u, tot: tot[u] || {n:0, amt:0} }))
    .sort((x,y) => y.tot.amt - x.tot.amt || x.name.localeCompare(y.name));
  const team = rows.reduce((s,r) => ({ n:s.n + r.tot.n, amt:s.amt + r.tot.amt }), {n:0, amt:0});
  return { fris, rows, team };
}

function trackerKpis(){
  document.getElementById("moLabel").textContent = monthLabel(S.month);
  const M = monthData(S.month);
  const ic = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const tile = (cls,icon,label,value,help,chip) => `
    <div class="card metric-card ${cls}">
      <div class="mc-top"><div class="badge">${icon}</div>${chip||""}</div>
      <div class="mc-label">${label}</div>
      <div class="mc-value">${value}</div>
      <div class="mc-help">${help}</div>
    </div>`;
  const paid = M.fris.filter(f => f.on).length;
  const isCur = S.month === ymOf(new Date());
  const upcoming = M.fris.filter(f => f.upcoming).length;
  return `<div class="kpi-row">
    ${tile("c-green", ic('<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
      "Team Spiffs", money(M.team.amt),
      isCur ? `earned so far this month${upcoming?` · ${upcoming} payday${upcoming>1?"s":""} to go`:""}` : `paid in ${MONTHS[parse(S.month+"-01").getMonth()]}`,
      isCur ? '<span class="chip live">↗ Live</span>' : "")}
    ${tile("c-purple", ic('<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>'),
      "Same / Next-Day", String(M.team.n), "qualifying bookings paid")}
    ${tile("c-cyan", ic('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
      "Spiff Paydays", `${paid} of ${M.fris.length}`, `Fridays in ${MONTHS[parse(S.month+"-01").getMonth()]} that paid a spiff`)}
  </div>`;
}

function trackerCard(){
  const M = monthData(S.month);
  if(!M.rows.length) return `<div class="card"><div class="empty">No paydays with bookings in ${monthLabel(S.month)} yet.</div></div>`;
  const head = M.fris.map(f => {
    const st = f.upcoming ? ["up","UPCOMING"] : f.on ? ["on","SPIFF ON"] : ["off","NO SPIFF"];
    return `<th class="r">Fri ${fmt(f.date).split(" ")[1]}<span class="fri ${st[0]}">${st[1]}</span></th>`;
  }).join("");
  const cell = (f,u) => {
    const v = f.per[u];
    if(!f.on) return `<td class="r mono zero">—</td>`;
    if(!v || !v.amt) return `<td class="r mono zero">$0</td>`;
    return `<td class="r mono">${money(v.amt)}${v.n?`<span class="n">×${v.n}</span>`:""}</td>`;
  };
  const body = M.rows.map(r => `<tr>
      <td class="agent-name">${esc(r.name)}</td>
      ${M.fris.map(f => cell(f, r.user)).join("")}
      <td class="r"><span class="total-pill${r.tot.amt?"":" zero"}">${money(r.tot.amt)}</span></td>
    </tr>`).join("");
  const colTot = M.fris.map(f => {
    const t = Object.values(f.per).reduce((s,v) => s + v.amt, 0);
    return `<td class="r mono">${f.on ? money(t) : "—"}</td>`;
  }).join("");
  return `<div class="card">
    <div class="eyebrow">Spiff Earnings</div>
    <h2 class="card-h">What spiffs paid — ${monthLabel(S.month)}</h2>
    <p class="card-sub">Each Friday's spiff, for the bookings made the week before it</p>
    <div class="tbl-scroll" style="margin-top:14px">
    <table>
      <thead><tr><th>Agent</th>${head}<th class="r">Month Total</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td>Team</td>${colTot}<td class="r mono">${money(M.team.amt)}</td></tr></tfoot>
    </table>
    </div>
  </div>`;
}

const moBtn = document.getElementById("moBtn");
const moPop = document.getElementById("moPop");
function closePop(){ moPop.classList.remove("open"); moBtn.setAttribute("aria-expanded","false"); }
moBtn.onclick = (e) => {
  e.stopPropagation();
  const open = moPop.classList.toggle("open");
  moBtn.setAttribute("aria-expanded", open ? "true" : "false");
};
document.addEventListener("click", (e) => { if(!moPop.contains(e.target)) closePop(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closePop(); });

function weekOf(d){ const m = mondayOf(d); return [iso(m), iso(addDays(m,6))]; }

function windowsCard(){
  // One row per Friday payday in the selected month, mirroring the columns of
  // the earnings table above: which week's bookings it pays, what the spiff
  // was, the rate, how many bookings qualified, and what it paid the team.
  const M = monthData(S.month);
  const rows = M.fris.map(f => {
    const [a,b] = f.setsWeek;
    const payout = Object.values(f.per).reduce((s,v) => s + v.amt, 0);
    const n = Object.values(f.per).reduce((s,v) => s + v.n, 0);
    let desc, rate, qual;
    if(f.win){
      desc = esc(f.win[5] || KINDS[f.win[1]] || f.win[1]);
      if(f.manual) desc += `<span class="sub"> + ${esc(f.manualNotes.join(", ") || "other spiffs")}</span>`;
      rate = `${money(f.win[4])} each`; qual = String(n);
    } else if(f.manual){
      desc = esc(f.manualNotes.join(", ") || "Spiff");
      const each = n ? payout / n : 0;
      rate = n && Number.isInteger(each) ? `${money(each)} each` : `<span class="sub">varies</span>`;
      qual = n ? String(n) : "—";
    } else {
      desc = `<span class="sub">No spiff</span>`; rate = "—"; qual = "—";
    }
    const del = A.pc && f.win ? `<button class="del" data-id="${esc(f.win[0])}" title="Turn this spiff off">✕</button>` : "";
    return `<tr>
      <td class="agent-name">Fri ${fmt(f.date)}${f.upcoming?` <span class="pill p-future">Upcoming</span>`:""}</td>
      <td class="mono">${fmt(a)} – ${fmt(b)}</td>
      <td class="kind">${desc}</td>
      <td class="r mono">${rate}</td>
      <td class="r mono">${qual}</td>
      <td class="r mono">${f.on ? money(payout) : "—"}</td>
      ${A.pc ? `<td class="r">${del}</td>` : ""}
    </tr>`;
  }).join("");

  // Admin: turn a spiff on. Defaults to next week, the one usually being decided.
  const nxt = weekOf(addDays(new Date(),7));
  const form = A.pc ? `
    <div class="form">
      <div><label>Spiff type</label>
        <select id="f_kind">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}</select></div>
      <div><label>Bookings from (Mon)</label><input type="date" id="f_start" value="${nxt[0]}"></div>
      <div><label>Bookings to (Sun)</label><input type="date" id="f_end" value="${nxt[1]}"></div>
      <div><label>$ each</label><input type="number" id="f_rate" step="0.5" min="0" value="5"></div>
      <div style="grid-column:1/-1"><label>Description agents see</label><input type="text" id="f_note" value="Same-day or next-day appointments"></div>
    </div>
    <div class="form-actions">
      <button class="btn pri" id="f_save">Turn spiff on</button>
      <span class="msg" id="f_msg"></span>
    </div>` : "";

  return `<div class="card">
    <div class="eyebrow">Spiff Details</div>
    <h2 class="card-h">Spiff by week — ${monthLabel(S.month)}</h2>
    <div class="tbl-scroll" style="margin-top:14px">
    <table>
      <thead><tr><th>Payday</th><th>Bookings Made</th><th>Spiff</th><th class="r">Rate</th><th class="r">Qualifying</th><th class="r">Payout</th>${A.pc?"<th></th>":""}</tr></thead>
      <tbody>${rows || `<tr><td colspan="6" class="empty">No paydays this month.</td></tr>`}</tbody>
      <tfoot><tr><td>Total</td><td></td><td></td><td></td><td class="r mono">${M.team.n}</td><td class="r mono">${money(M.team.amt)}</td>${A.pc?"<td></td>":""}</tr></tfoot>
    </table>
    </div>
    ${form}
  </div>`;
}

/* ----------------------------------------------------------------- admin */
async function adminPost(path, payload, msgEl){
  const el = document.getElementById(msgEl);
  if(el){ el.className = "msg"; el.textContent = "Saving…"; }
  const r = await fetch(path, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ admin: A.pc, ...payload }),
  });
  const j = await r.json().catch(()=>({}));
  if(!r.ok || j.error){
    if(String(j.error||"").includes("passcode")){ A.pc=""; sessionStorage.removeItem("cc_admin_pc"); }
    if(el){ el.textContent = j.error || `HTTP ${r.status}`; el.className = "msg bad"; }
    return false;
  }
  if(el){ el.textContent = "Saved."; el.className = "msg ok"; }
  return true;
}

function wire(){
  const save = document.getElementById("f_save");
  if(save) save.onclick = async ()=>{
    const v = id => document.getElementById(id).value;
    save.disabled = true;
    const ok = await adminPost("/api/spiff-window", {
      kind: v("f_kind"), start_date: v("f_start"), end_date: v("f_end"),
      rate: Number(v("f_rate")), note: v("f_note"),
    }, "f_msg");
    save.disabled = false;
    if(ok) await reload();
  };
  document.querySelectorAll(".del").forEach(b => b.onclick = async ()=>{
    if(!A.pc) return;
    if(!confirm("Turn this spiff off? That week's spiff payout drops to $0 on the Commission tab.")) return;
    b.disabled = true;
    const ok = await adminPost("/api/spiff-window/delete", { id: b.dataset.id }, null);
    if(ok) await reload(); else b.disabled = false;
  });
}

document.getElementById("adminBtn").onclick = ()=>{
  if(A.pc){ A.pc=""; sessionStorage.removeItem("cc_admin_pc"); render(); return; }
  const pc = prompt("Admin passcode");
  if(!pc) return;
  A.pc = pc; sessionStorage.setItem("cc_admin_pc", pc); render();
};

load();
</script>
