<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Appointments</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ll-green:#00b580; --ll-magenta:#f40070; --ll-purple:#8a56f3;
  --ll-cyan:#00c5ff;  --ll-yellow:#ffd900;  --ll-black:#191718;
  --ll-surface:#f9fafb; --ll-border:#e5e7eb;
  --muted:#6b7280; --dim:#a1a1aa;
  --card-shadow:0 1px 3px rgba(25,23,24,.08), 0 16px 36px rgba(25,23,24,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ll-black);
  background:
    radial-gradient(circle at 14% 0%, rgba(0,197,255,.06), transparent 28%),
    linear-gradient(180deg,#fff 0%, #f9fafb 34%, #f6f7f8 100%);
  min-height:100vh; padding:16px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{
  border:1px solid rgba(229,231,235,.92); background:rgba(255,255,255,.94);
  box-shadow:var(--card-shadow); border-radius:14px; padding:18px;
  animation:fadeUp 260ms ease both;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;color:#0094aa;
  font-family:"Outfit",sans-serif;font-size:.72rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;
}
.card-h{font-family:"Nunito";font-size:1.08rem;font-weight:850;line-height:1.05;margin:0 0 2px}
.card-sub{font-size:.87rem;color:var(--muted);font-weight:700;margin:0}
.filter-bar{
  border:1px solid rgba(229,231,235,.92); border-radius:18px;
  background:rgba(255,255,255,.96); box-shadow:var(--card-shadow);
  padding:12px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  position:relative; z-index:40; animation:fadeUp 260ms ease both;
}
.filter-control{
  display:inline-flex;align-items:center;gap:9px;min-height:40px;
  border:1px solid var(--ll-border);border-radius:999px;background:#fff;
  color:var(--ll-black);font-family:"Nunito",sans-serif;font-size:.93rem;
  font-weight:850;padding:0 16px;box-shadow:0 1px 2px rgba(25,23,24,.04);
  cursor:pointer;transition:border-color 160ms ease,box-shadow 160ms ease;white-space:nowrap;
}
.filter-control:hover,.filter-control[aria-expanded="true"]{
  border-color:rgba(138,86,243,.62); box-shadow:0 7px 18px rgba(138,86,243,.08);
}
.filter-control .chev{transition:transform 160ms ease;color:#9ca3af}
.filter-control[aria-expanded="true"] .chev{transform:rotate(180deg)}
.freshness{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted)}
.pop-wrap{position:relative}
.pop{
  position:absolute;top:calc(100% + 8px);left:0;z-index:60;display:none;
  width:min(300px,calc(100vw - 48px));border:1px solid rgba(229,231,235,.94);
  border-radius:13px;background:#fff;
  box-shadow:0 22px 54px rgba(25,23,24,.14),0 2px 8px rgba(25,23,24,.08);overflow:hidden;
}
.pop.open{display:block}
.pop-list{max-height:340px;overflow:auto;padding:8px}
.pop-item{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;
  cursor:pointer;font-size:.9rem;font-weight:750;color:#3f3f46;
  transition:background 140ms ease;
}
.pop-item:hover{background:#f4f4f5}
.pop-item.on{background:rgba(0,197,255,.12);color:#0094aa;font-weight:850}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.metric-card{position:relative;overflow:hidden}
.metric-card::after{
  content:"";position:absolute;right:-22px;bottom:-38px;width:112px;height:112px;
  border-radius:999px;opacity:.09;background:currentColor;pointer-events:none;
}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between}
.badge{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;background:color-mix(in srgb,currentColor 12%,white);
}
.chip{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:4px 8px;font-size:.72rem;font-weight:850}
.chip.active{color:#007e5c;background:rgba(0,181,128,.10)}
.mc-label{
  font-family:"Nunito";font-size:.82rem;font-weight:850;letter-spacing:.02em;
  text-transform:uppercase;color:var(--muted);margin-top:14px;
}
.mc-value{
  font-family:"Outfit",sans-serif;font-size:clamp(1.65rem,2.4vw,2.35rem);
  font-weight:900;line-height:1;margin-top:2px;
}
.mc-help{font-family:"Nunito";font-size:.87rem;font-weight:700;color:var(--muted);margin-top:6px}
.c-cyan{color:var(--ll-cyan)} .c-green{color:var(--ll-green)}
.c-purple{color:var(--ll-purple)} .c-yellow{color:#d09f00}
.tbl-scroll{overflow:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:.87rem;font-weight:700}
thead th{
  text-align:left;font-size:.7rem;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);padding:0 12px 10px;white-space:nowrap;
}
thead th.r, td.r{text-align:right}
tbody td{padding:11px 12px;border-top:1px solid #f1f2f4;white-space:nowrap}
tbody tr:hover{background:#fafafa}
.mono{font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-weight:700;font-size:.78rem}
.agent-name{font-weight:850}
.pill-status{display:inline-block;border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:850}
.s-sold{color:#007e5c;background:rgba(0,181,128,.10)}
.s-unsold{color:#8a6d00;background:rgba(255,217,0,.16)}
/* duplicate = same phone booked twice on the same day */
tbody tr.dup{background:rgba(244,0,112,.055)}
tbody tr.dup:hover{background:rgba(244,0,112,.09)}
.dup-tag{
  display:inline-block;margin-left:7px;border-radius:999px;padding:2px 8px;
  font-size:.68rem;font-weight:900;letter-spacing:.02em;
  color:#b90053;background:rgba(244,0,112,.11);vertical-align:1px;
}
.dup-tag.cross{color:#fff;background:var(--ll-magenta)}
/* Call QA pills (Credit / Homeowner) — scored from the call recording */
.qa{display:inline-block;min-width:40px;text-align:center;border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:900;cursor:default}
.qa.yes{color:#007e5c;background:rgba(0,181,128,.12)}
.qa.no{color:#b90053;background:rgba(244,0,112,.10)}
.qa.unclear{color:#8a6d00;background:rgba(255,217,0,.20)}
.qa.notasked{color:#5b3fb0;background:rgba(138,86,243,.12)}
.ch{display:inline-block;border-radius:999px;padding:3px 9px;font-size:.72rem;font-weight:900}
.ch.call{color:#0077a3;background:rgba(0,197,255,.12)}
.ch.sms{color:#b90053;background:rgba(244,0,112,.10)}
.qa.none{color:#c4c4c8;background:transparent;min-width:0;padding:3px 4px}
.rv-tag{
  display:inline-block;margin-left:7px;border-radius:999px;padding:2px 8px;
  font-size:.68rem;font-weight:900;color:#8a6d00;background:rgba(255,217,0,.22);vertical-align:1px;cursor:default;
}
.qa-legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;font-size:.78rem;font-weight:750;color:var(--muted)}
/* admin QA edit */
.qa-cell{display:inline-flex;align-items:center;gap:4px}
.qa.edited::after{content:"✎";margin-left:4px;font-size:.7rem;opacity:.75}
.qa-pen{
  border:0;background:transparent;cursor:pointer;padding:2px 4px;border-radius:6px;
  color:#a1a1aa;opacity:.3;transition:opacity 120ms ease,color 120ms ease;line-height:1;
}
tbody tr:hover .qa-pen{opacity:1}
.qa-pen:hover{color:#8a56f3;background:#f4f4f5}
#qaMenu{
  position:fixed;z-index:110;display:none;width:240px;background:#fff;border:1px solid var(--ll-border);
  border-radius:12px;box-shadow:0 22px 54px rgba(25,23,24,.16),0 2px 8px rgba(25,23,24,.08);padding:10px;
}
#qaMenu .mh{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 4px 8px}
#qaMenu input{
  width:100%;border:1px solid var(--ll-border);border-radius:8px;padding:7px 9px;margin-bottom:8px;
  font-family:"Nunito",sans-serif;font-size:.82rem;font-weight:700;
}
#qaMenu .opts{display:flex;flex-wrap:wrap;gap:6px}
#qaMenu .opts button{border:0;cursor:pointer;font-family:"Nunito",sans-serif}
#qaMenu .reset{
  display:block;width:100%;margin-top:8px;border:1px solid var(--ll-border);background:#fff;border-radius:8px;
  padding:6px;font-family:"Nunito",sans-serif;font-size:.78rem;font-weight:800;color:var(--muted);cursor:pointer;
}
#qaMenu .msg{font-size:.78rem;font-weight:800;margin-top:8px;color:var(--muted)}
#qaMenu .msg.err{color:#b90053}
#qaTip{
  position:fixed;z-index:100;display:none;max-width:340px;pointer-events:none;
  background:#191718;color:#fff;border-radius:10px;padding:10px 12px;
  font-size:.8rem;font-weight:650;line-height:1.35;box-shadow:0 12px 30px rgba(25,23,24,.25);white-space:normal;
}
#qaTip b{font-weight:900}
#qaTip .q{margin-top:6px;color:#d4d4d8;font-style:italic}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.export-btn{
  display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;
  border:1px solid var(--ll-border);border-radius:999px;background:#fff;color:var(--ll-black);
  font-family:"Nunito",sans-serif;font-size:.85rem;font-weight:850;cursor:pointer;white-space:nowrap;
  transition:border-color 160ms ease,box-shadow 160ms ease;
}
.export-btn:hover{border-color:rgba(138,86,243,.62);box-shadow:0 7px 18px rgba(138,86,243,.08)}
.export-btn:disabled{opacity:.4;cursor:default}
.pager{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:.82rem;font-weight:750;color:var(--muted)}
.pager button{
  border:1px solid var(--ll-border);background:#fff;border-radius:8px;padding:6px 12px;
  font-family:"Nunito";font-weight:850;font-size:.82rem;cursor:pointer;color:var(--ll-black);
}
.pager button:disabled{opacity:.4;cursor:default}
.err{
  border:1px solid rgba(244,0,112,.3);background:rgba(244,0,112,.05);color:#b90053;
  border-radius:14px;padding:18px;font-weight:750;
}
.skel{
  background:linear-gradient(90deg,#f1f2f4 25%,#e9eaec 50%,#f1f2f4 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px;
}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="filter-bar">
    <div class="pop-wrap">
      <button class="filter-control" id="wkBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span id="wkLabel">—</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="wkPop"><div class="pop-list" id="wkList"></div></div>
    </div>
    <div class="pop-wrap">
      <button class="filter-control" id="agBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2" stroke-linecap="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="agLabel">All Agents</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="agPop"><div class="pop-list" id="agList"></div></div>
    </div>
    <div class="pop-wrap">
      <button class="filter-control" id="dpBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span id="dpLabel">All Appointments</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="dpPop"><div class="pop-list" id="dpList"></div></div>
    </div>
    <div class="pop-wrap">
      <button class="filter-control" id="crBtn" aria-expanded="false">
        <span id="crLabel">Credit: All</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="crPop"><div class="pop-list" id="crList"></div></div>
    </div>
    <div class="pop-wrap">
      <button class="filter-control" id="hoBtn" aria-expanded="false">
        <span id="hoLabel">Homeowner: All</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="hoPop"><div class="pop-list" id="hoList"></div></div>
    </div>
    <div class="pop-wrap" id="chWrap" style="display:none">
      <button class="filter-control" id="chBtn" aria-expanded="false">
        <span id="chLabel">Channel: All</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="pop" id="chPop"><div class="pop-list" id="chList"></div></div>
    </div>
    <div class="freshness" id="freshness">Loading…</div>
  </div>
  <div id="content"></div>
</div>
<div id="qaTip"></div>
<div id="qaMenu"></div>

<script>
"use strict";

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const PAGE = 50;
const S = { data:null, err:null, week:null, weeks:[], agent:"", dup:"", credit:"", home:"", ch:"", page:1 };
// dupKey -> {n, agents:Set}. Key = same phone booked on the same day.
// "cross" = the same homeowner credited to two different setters that day,
// which is the case that actually pays twice for one lead.
const DUP = new Map();
const dupKey = r => `${r[0]}|${String(r[8]||"").replace(/\D/g,"")}`;

function buildDupes(){
  DUP.clear();
  S.data.appts.forEach(r=>{
    const ph = String(r[8]||"").replace(/\D/g,"");
    if(ph.length < 7) return;            // no phone -> can't call it a duplicate
    const k = dupKey(r);
    let e = DUP.get(k);
    if(!e){ e = { n:0, agents:new Set() }; DUP.set(k, e); }
    e.n++; if(r[1]) e.agents.add(r[1]);
  });
  for(const [k,e] of DUP) if(e.n < 2) DUP.delete(k);
}
const dupOf = r => DUP.get(dupKey(r)) || null;

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmt = s => { const d=parse(s); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; };
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));

async function load(){
  try{
    const r = await fetch("/api/data", { cache:"no-store" });
    if(r.status===401){ parent.location.href="/login"; return; }
    const j = await r.json();
    if(!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
    S.data = j;
    buildDupes(); buildWeeks(); buildAgents(); buildDupFilter(); buildQaFilters(); buildChannel();
    const m = j.meta;
    if(m && m.last_sync){
      const t = new Date(m.last_sync);
      document.getElementById("freshness").textContent =
        "Data synced " + t.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    }
  }catch(e){ S.err = String(e.message||e); }
  render();
}

function buildWeeks(){
  const dates = S.data.appts.map(r=>r[0]).sort();
  if(!dates.length) return;
  let m = mondayOf(parse(dates[0]));
  const lastM = mondayOf(new Date());
  const out=[];
  while(m <= lastM){ out.push(iso(m)); m = addDays(m,7); }
  S.weeks = out.reverse();
  S.week = S.weeks[0]; // current week by default — agents watch it fill up live
  const list = document.getElementById("wkList");
  list.innerHTML = S.weeks.map(w=>`
    <div class="pop-item${w===S.week?" on":""}" data-w="${w}">
      Week of ${fmt(w)} – ${fmt(iso(addDays(parse(w),6)))}
    </div>`).join("");
  list.querySelectorAll(".pop-item").forEach(el=>{
    el.onclick = ()=>{
      S.week = el.dataset.w; S.page = 1;
      list.querySelectorAll(".pop-item").forEach(x=>x.classList.toggle("on",x.dataset.w===S.week));
      document.getElementById("wkLabel").textContent = `Week of ${fmt(S.week)} – ${fmt(iso(addDays(parse(S.week),6)))}`;
      closePops(); render();
    };
  });
  document.getElementById("wkLabel").textContent = `Week of ${fmt(S.week)} – ${fmt(iso(addDays(parse(S.week),6)))}`;
}

function buildAgents(){
  const list = document.getElementById("agList");
  const opts = [["","All Agents"], ...Object.entries(S.data.agents)];
  list.innerHTML = opts.map(([u,n])=>`
    <div class="pop-item${u===S.agent?" on":""}" data-u="${esc(u)}">${esc(n)}</div>`).join("");
  list.querySelectorAll(".pop-item").forEach(el=>{
    el.onclick = ()=>{
      S.agent = el.dataset.u; S.page = 1;
      list.querySelectorAll(".pop-item").forEach(x=>x.classList.toggle("on",x.dataset.u===S.agent));
      document.getElementById("agLabel").textContent = S.agent ? (S.data.agents[S.agent]||S.agent) : "All Agents";
      closePops(); render();
    };
  });
}

const DUP_OPTS = [
  ["",      "All Appointments"],
  ["any",   "Duplicates only"],
  ["cross", "Cross-setter dupes"],
];

function buildDupFilter(){
  const list = document.getElementById("dpList");
  list.innerHTML = DUP_OPTS.map(([v,n])=>`
    <div class="pop-item${v===S.dup?" on":""}" data-d="${v}">${n}</div>`).join("");
  list.querySelectorAll(".pop-item").forEach(el=>{
    el.onclick = ()=>{
      S.dup = el.dataset.d; S.page = 1;
      list.querySelectorAll(".pop-item").forEach(x=>x.classList.toggle("on",x.dataset.d===S.dup));
      document.getElementById("dpLabel").textContent =
        (DUP_OPTS.find(o=>o[0]===S.dup)||DUP_OPTS[0])[1];
      closePops(); render();
    };
  });
}

function filtered(){
  const a = S.week, b = iso(addDays(parse(S.week),6));
  return S.data.appts.filter(r =>{
    if(r[0] < a || r[0] > b) return false;
    if(S.agent && r[1] !== S.agent) return false;
    if(S.dup){
      const d = dupOf(r);
      if(!d) return false;
      if(S.dup === "cross" && d.agents.size < 2) return false;
    }
    if(S.credit && qaVal(r,"credit") !== S.credit) return false;
    if(S.home && qaVal(r,"home") !== S.home) return false;
    if(S.ch && channel(r) !== S.ch) return false;
    return true;
  }).sort((x,y)=> y[0] < x[0] ? -1 : y[0] > x[0] ? 1 : 0);
}

function render(){
  const c = document.getElementById("content");
  if(S.err){ c.innerHTML = `<div class="err"><strong>Couldn't load appointments.</strong><br>${esc(S.err)}</div>`; return; }
  if(!S.data){
    c.innerHTML = `<div class="kpi-row">${'<div class="card skel" style="height:150px"></div>'.repeat(3)}</div>
      <div class="card skel" style="height:300px;margin-top:14px"></div>`;
    return;
  }
  const rows = filtered();
  c.innerHTML = kpis(rows) + tableCard(rows);
  wirePager(rows);
}

function kpis(rows){
  const total = rows.length;
  const perAgent = {};
  rows.forEach(r=>{ if(r[1]) perAgent[r[1]]=(perAgent[r[1]]||0)+1; });
  const top = Object.entries(perAgent).sort((a,b)=>b[1]-a[1])[0];
  const days = {}; rows.forEach(r=>{ days[r[0]]=(days[r[0]]||0)+1; });
  const nDays = Math.max(1, Object.keys(days).length);

  const ic = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const tile = (cls,icon,label,value,help,chip) => `
    <div class="card metric-card ${cls}">
      <div class="mc-top"><div class="badge">${icon}</div>${chip||""}</div>
      <div class="mc-label">${label}</div>
      <div class="mc-value">${value}</div>
      <div class="mc-help">${help}</div>
    </div>`;

  return `<div class="kpi-row">
    ${tile("c-cyan", ic('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/>'),
      "Appointments", total.toLocaleString(),
      `${Math.round(total/nDays*10)/10} per day`,
      '<span class="chip active">↗ Active</span>')}
    ${tile("c-green", ic('<path d="M20 6L9 17l-5-5"/>'),
      "Today", (days[iso(new Date())]||0).toLocaleString(),
      "appointments booked today")}
    ${tile("c-purple", ic('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/>'),
      "Top Setter", top ? esc(S.data.agents[top[0]]||top[0]).split(" ")[0] : "—",
      top ? `${top[1]} appointment${top[1]===1?"":"s"} this week` : "no appointments yet")}
  </div>`;
}

// Counts the flagged rows in the current view, so the header says what the
// pink is before you go looking for it.
function dupNote(rows){
  if(S.dup) return "";
  let dup = 0, cross = 0;
  rows.forEach(r=>{ const d = dupOf(r); if(!d) return; dup++; if(d.agents.size>1) cross++; });
  if(!dup) return "";
  return ` · <span style="color:#b90053">${dup} duplicate${dup===1?"":"s"}${
    cross ? ` (${cross} cross-setter)` : ""}</span>`;
}

function tableCard(rows){
  const start = (S.page-1)*PAGE;
  const page = rows.slice(start, start+PAGE);
  const body = page.map(r=>{
    const d = dupOf(r);
    const cross = d && d.agents.size > 1;
    const tag = d
      ? `<span class="dup-tag${cross?" cross":""}" title="${cross
          ? "Same phone booked twice this day by two different setters"
          : "Same phone booked twice this day"}">${d.n}× ${cross?"cross":"dupe"}</span>`
      : "";
    return `
    <tr class="${d?"dup":""}">
      <td class="mono">${fmt(r[0])}</td>
      <td class="agent-name">${r[1] ? esc(S.data.agents[r[1]]||r[1]) : '<span class="sub">Unattributed</span>'}</td>
      <td>${esc(r[3])} ${esc(r[4])}${tag}${reviewTag(r)}</td>
      <td>${qaPill(r,"credit")}</td>
      <td>${qaPill(r,"home")}</td>${isAdmin()?`
      <td>${chPill(r)}</td>`:""}
      <td class="mono">${esc(r[8]||"—")}</td>
      <td class="sub">${esc(r[9]||"—")}</td>
      <td class="sub">${esc(r[2])}</td>
      <td>${esc(r[5])}${r[6]?`, ${esc(r[6])}`:""}</td>
    </tr>`;
  }).join("");
  const pages = Math.max(1, Math.ceil(rows.length/PAGE));
  return `<div class="card">
    <div class="card-top"><div>
    <div class="eyebrow">Appointment Log</div>
    <h2 class="card-h">Every Appointment — Week of ${fmt(S.week)}</h2>
    <p class="card-sub">${rows.length} appointment${rows.length===1?"":"s"}${S.agent?` · ${esc(S.data.agents[S.agent]||S.agent)}`:""}${
      dupNote(rows)}</p>
    </div>
    <button class="export-btn" id="exportBtn" ${rows.length?"":"disabled"} title="Download every row in this view (all pages) as a CSV">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a56f3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Export CSV
    </button></div>
    <div class="qa-legend">Credit &amp; Homeowner, from the call recording:
      <span class="qa yes">Yes</span>
      <span class="qa no">No</span>
      <span class="qa unclear">Unclear</span>
      <span class="qa notasked">Not Asked</span>
      <span class="qa none">—</span> not scored yet or transfer · hover a pill for the quote
    </div>
    <div class="tbl-scroll" style="margin-top:14px">
    <table>
      <thead><tr><th>Booked</th><th>Setter</th><th>Lead</th><th>Credit</th><th>Homeowner</th>${isAdmin()?"<th>Channel</th>":""}<th>Phone</th><th>Email</th><th>Campaign</th><th>Location</th></tr></thead>
      <tbody>${body || `<tr><td colspan="${isAdmin()?10:9}" class="sub" style="padding:30px;text-align:center">No appointments this week yet.</td></tr>`}</tbody>
    </table>
    </div>
    ${pages>1?`<div class="pager">
      <button id="pgPrev" ${S.page<=1?"disabled":""}>‹ Prev</button>
      <span>Page ${S.page} of ${pages}</span>
      <button id="pgNext" ${S.page>=pages?"disabled":""}>Next ›</button>
    </div>`:""}
  </div>`;
}

/* ---- Export ----
 * Downloads exactly what the filters show (every page, not just this one),
 * plus the QA detail behind each pill. Built in the browser from data the
 * page already has — no new endpoint, nothing agents can't already see.
 */
function exportCsv(rows){
  const cell = v => { v = v==null ? "" : String(v); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const label = (r,t) => { const k = qaVal(r,t); return k==="none" ? (isTransfer(r) ? "Transfer" : "Not scored") : QA_OUT[k].txt; };
  const head = ["Booked","Setter","First","Last","Credit","Homeowner",...(isAdmin()?["Channel"]:[]),"Needs Review","Phone","Email","Campaign","City","State",
                "Appointment","Duplicate","Credit Reason","Credit Quote","Homeowner Reason","Homeowner Quote","Review Reason","Lead ID"];
  const lines = [head.join(",")];
  for(const r of rows){
    const q = isTransfer(r) ? null : qaRow(r), d = dupOf(r);
    lines.push([
      r[0], r[1] ? (S.data.agents[r[1]]||r[1]) : "Unattributed", r[3], r[4],
      label(r,"credit"), label(r,"home"), ...(isAdmin()?[channel(r)==="sms"?"SMS":"Call"]:[]), q && q[6] ? "Yes" : "",
      r[8], r[9], r[2], r[5], r[6], r[10] || "",
      d ? (d.agents.size>1 ? "Cross-setter" : "Duplicate") : "",
      q ? humanize(q[1]) : "", q ? q[2] : "", q ? humanize(q[4]) : "", q ? q[5] : "",
      q && q[6] ? humanize(q[7]) : "", r[11] || "",
    ].map(cell).join(","));
  }
  const parts = ["appointments", S.week];
  if(S.agent) parts.push(String(S.data.agents[S.agent]||S.agent).split(" ")[0]);
  if(S.credit) parts.push("credit-"+S.credit);
  if(S.home) parts.push("homeowner-"+S.home);
  if(S.dup) parts.push(S.dup==="cross" ? "cross-dupes" : "dupes");
  if(S.ch) parts.push(S.ch);
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = parts.join("_").toLowerCase().replace(/[^a-z0-9_-]+/g,"-") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function wirePager(rows){
  const ex = document.getElementById("exportBtn");
  if(ex) ex.onclick = ()=>exportCsv(rows);
  const prev = document.getElementById("pgPrev"), next = document.getElementById("pgNext");
  if(prev) prev.onclick = ()=>{ S.page--; render(); };
  if(next) next.onclick = ()=>{ S.page++; render(); };
}

/* ---- Call QA ----
 * S.data.appt_qa[lead_id] = [credit, credit_reason, credit_quote, homeowners,
 *   homeowners_reason, homeowners_quote, needs_review, review_reason]
 * Four outcomes (Manny): Yes = Pass, No = Fail, Unclear, Not Asked.
 * Not scored yet / transfers / anything else -> blank "—" (key "none").
 * Transfers are never scored on qualification: the dialer list doesn't always
 * say "transfer" (an eLocal transfer can ride a HomeFix list), so the
 * Leadspedia campaign name decides.
 */
const QA_TOPICS = { credit:"Credit", home:"Homeowner" };
const QA_OUT = {
  yes:      { txt:"Yes",       head:"confirmed on the call" },
  no:       { txt:"No",        head:"failed" },
  unclear:  { txt:"Unclear",   head:"unclear" },
  notasked: { txt:"Not Asked", head:"not asked on the call" },
  none:     { txt:"—",         head:"not scored" },
};
const QA_MAP = { "Pass":"yes", "Fail":"no", "Unclear":"unclear", "Not Asked":"notasked" };
const isTransfer = r => /transfer/i.test(String(r[2]||""));
const qaRow = r => (S.data.appt_qa||{})[r[11]] || null;
// Manny's correction for this lead/topic, if any ("Pass" | "Fail" | ...).
const qaEdit = (r, topic) => ((S.data.qa_edit||{})[r[11]]||{})[topic] || "";
const qaEditNote = (r, topic) => ((S.data.qa_edit_note||{})[r[11]]||{})[topic] || "";
function qaVal(r, topic){
  const e = qaEdit(r, topic);
  if(e) return QA_MAP[e] || "none";       // an edit always wins, transfers included
  if(isTransfer(r)) return "none";
  const q = qaRow(r); if(!q) return "none";
  return QA_MAP[String((topic==="credit" ? q[0] : q[3]) || "")] || "none";
}
const humanize = s => { s = String(s||"").replace(/_/g," ").trim(); return s ? s[0].toUpperCase()+s.slice(1) : ""; };
function qaPill(r, topic){
  const label = QA_TOPICS[topic], k = qaVal(r, topic), o = QA_OUT[k];
  const q = qaRow(r);
  const edit = qaEdit(r, topic);
  let head = `${label}: ${o.head}`, why = "", quote = "";
  if(edit){
    const orig = q && !isTransfer(r) ? (topic==="credit" ? q[0] : q[3]) : "";
    head = `${label}: ${o.txt} — corrected by Manny`;
    const nice = v => ({ Pass:"Yes", Fail:"No" })[v] || v;
    why = [qaEditNote(r, topic), orig ? `Scorer said: ${nice(orig)}` : ""].filter(Boolean).join(" · ");
    if(q && !isTransfer(r)) quote = (topic==="credit" ? q[2] : q[5]) || "";
  }
  else if(isTransfer(r)) head = `${label}: not required (transfer)`;
  else if(!q) head = `${label}: not scored yet`;
  else { why = humanize(topic==="credit" ? q[1] : q[4]); quote = (topic==="credit" ? q[2] : q[5]) || ""; }
  const pill = `<span class="qa ${k}${edit?" edited":""}" data-tip-h="${esc(head)}" data-tip-w="${esc(why)}" data-tip-q="${esc(quote)}">${o.txt}</span>`;
  if(!isAdmin() || !r[11]) return pill;
  return `<span class="qa-cell">${pill}<button class="qa-pen" title="Correct this" data-lead="${esc(r[11])}" data-topic="${topic}">✎</button></span>`;
}
const QA_FILTER_OPTS = [["","All"],["yes","Yes"],["no","No"],["unclear","Unclear"],["notasked","Not Asked"],["none","Not scored"]];
function buildQaFilters(){
  [["credit","crList","crLabel","Credit"],["home","hoList","hoLabel","Homeowner"]].forEach(([key,listId,labelId,name])=>{
    const list = document.getElementById(listId);
    list.innerHTML = QA_FILTER_OPTS.map(([v,n])=>`
      <div class="pop-item${v===S[key]?" on":""}" data-v="${v}">${n}</div>`).join("");
    list.querySelectorAll(".pop-item").forEach(el=>{
      el.onclick = ()=>{
        S[key] = el.dataset.v; S.page = 1;
        list.querySelectorAll(".pop-item").forEach(x=>x.classList.toggle("on",x.dataset.v===S[key]));
        document.getElementById(labelId).textContent =
          `${name}: ${(QA_FILTER_OPTS.find(o=>o[0]===S[key])||QA_FILTER_OPTS[0])[1]}`;
        closePops(); render();
      };
    });
  });
}
/* ---- Channel (ADMIN ONLY) ----
 * appt_sms is only in the payload when signed in with the admin password —
 * the server leaves it out for agents, so nothing here is hidden client-side.
 * Inferred, not recorded: no 60s+ dialer call to that phone in the 24h
 * before the lead posted = set by text.
 */
let SMS = null;
const isAdmin = () => !!(S.data && S.data.admin && Array.isArray(S.data.appt_sms));
const channel = r => isTransfer(r) ? "call" : (SMS && SMS.has(r[11]) ? "sms" : "call");
const CH_OPTS = [["","All"],["call","Call"],["sms","SMS"]];
function buildChannel(){
  if(!isAdmin()) return;
  SMS = new Set(S.data.appt_sms);
  document.getElementById("chWrap").style.display = "";
  const list = document.getElementById("chList");
  list.innerHTML = CH_OPTS.map(([v,n])=>`<div class="pop-item${v===S.ch?" on":""}" data-v="${v}">${n}</div>`).join("");
  list.querySelectorAll(".pop-item").forEach(el=>{
    el.onclick = ()=>{
      S.ch = el.dataset.v; S.page = 1;
      list.querySelectorAll(".pop-item").forEach(x=>x.classList.toggle("on",x.dataset.v===S.ch));
      document.getElementById("chLabel").textContent = `Channel: ${(CH_OPTS.find(o=>o[0]===S.ch)||CH_OPTS[0])[1]}`;
      closePops(); render();
    };
  });
}
const chPill = r => channel(r)==="sms" ? '<span class="ch sms">SMS</span>' : '<span class="ch call">Call</span>';

function reviewTag(r){
  const q = (S.data.appt_qa||{})[r[11]];
  if(!q || !q[6] || isTransfer(r)) return "";
  return `<span class="rv-tag" data-tip-h="Flagged for review" data-tip-w="${esc(humanize(q[7]))}" data-tip-q="">Review</span>`;
}
(function wireTip(){
  const tip = document.getElementById("qaTip");
  document.addEventListener("mouseover", e=>{
    const el = e.target.closest && e.target.closest("[data-tip-h]");
    if(!el){ tip.style.display="none"; return; }
    const h = el.dataset.tipH, w = el.dataset.tipW, q = el.dataset.tipQ;
    tip.innerHTML = `<b>${esc(h)}</b>${w&&!/^(not asked|confirmed)$/i.test(w)?`<div>${esc(w)}</div>`:""}${q?`<div class="q">“${esc(q)}”</div>`:""}`;
    tip.style.display = "block";
    const b = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
    let x = Math.min(window.innerWidth - t.width - 8, Math.max(8, b.left + b.width/2 - t.width/2));
    let y = b.top - t.height - 8; if(y < 8) y = b.bottom + 8;
    tip.style.left = x+"px"; tip.style.top = y+"px";
  });
  document.addEventListener("scroll", ()=>{ tip.style.display="none"; }, true);
})();

/* ---- Admin: correct a QA pill ----
 * Saves to leads.cc_qa_override through /api/qa-override (server checks the
 * admin login). Our own table, so the scoring job can't overwrite it.
 */
const QA_EDIT_OPTS = [["Pass","yes"],["Fail","no"],["Unclear","unclear"],["Not Asked","notasked"]];
const MENU = { lead:"", topic:"", busy:false };
function openQaMenu(btn){
  const menu = document.getElementById("qaMenu");
  MENU.lead = btn.dataset.lead; MENU.topic = btn.dataset.topic; MENU.busy = false;
  const cur = ((S.data.qa_edit||{})[MENU.lead]||{})[MENU.topic] || "";
  const note = ((S.data.qa_edit_note||{})[MENU.lead]||{})[MENU.topic] || "";
  menu.innerHTML = `
    <div class="mh">Set ${QA_TOPICS[MENU.topic]}</div>
    <input id="qaNote" maxlength="300" placeholder="Note (optional), e.g. said 506" value="${esc(note)}">
    <div class="opts">${QA_EDIT_OPTS.map(([v,k])=>
      `<button class="qa ${k}" data-v="${v}">${QA_OUT[k].txt}${cur===v?" ✓":""}</button>`).join("")}</div>
    ${cur ? `<button class="reset" data-v="">Undo my correction (back to scorer)</button>` : ""}
    <div class="msg" id="qaMsg"></div>`;
  menu.style.display = "block";
  const b = btn.getBoundingClientRect(), m = menu.getBoundingClientRect();
  menu.style.left = Math.min(window.innerWidth - m.width - 8, Math.max(8, b.left - 8)) + "px";
  let y = b.bottom + 6; if(y + m.height > window.innerHeight - 8) y = Math.max(8, b.top - m.height - 6);
  menu.style.top = y + "px";
  menu.querySelectorAll("button[data-v]").forEach(x => x.onclick = (e)=>{ e.stopPropagation(); saveQa(x.dataset.v); });
  document.getElementById("qaNote").focus();
}
function closeQaMenu(){ const m = document.getElementById("qaMenu"); if(m) m.style.display = "none"; }
async function saveQa(value){
  if(MENU.busy) return;
  MENU.busy = true;
  const msg = document.getElementById("qaMsg");
  const note = (document.getElementById("qaNote")||{}).value || "";
  msg.className = "msg"; msg.textContent = "Saving…";
  try{
    const r = await fetch("/api/qa-override", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ admin:"session", lead_id:MENU.lead, topic:MENU.topic, value, note: value ? note : "" }),
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
    // Mirror the saved state locally so the table updates without a reload.
    S.data.qa_edit = S.data.qa_edit || {}; S.data.qa_edit_note = S.data.qa_edit_note || {};
    const e = S.data.qa_edit[MENU.lead] = S.data.qa_edit[MENU.lead] || {};
    const n = S.data.qa_edit_note[MENU.lead] = S.data.qa_edit_note[MENU.lead] || {};
    if(value){ e[MENU.topic] = value; if(note) n[MENU.topic] = note; else delete n[MENU.topic]; }
    else { delete e[MENU.topic]; delete n[MENU.topic]; }
    closeQaMenu(); render();
  }catch(err){
    MENU.busy = false;
    msg.className = "msg err"; msg.textContent = "Didn't save: " + String(err.message||err);
  }
}
document.addEventListener("click", (e)=>{
  const pen = e.target.closest && e.target.closest(".qa-pen");
  if(pen){ e.stopPropagation(); closePops(); openQaMenu(pen); return; }
  if(e.target.closest && e.target.closest("#qaMenu")) return;
  closeQaMenu();
}, true);
document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape") closeQaMenu();
  if(e.key==="Enter" && e.target && e.target.id==="qaNote") e.preventDefault();
});
document.addEventListener("scroll", (e)=>{ if(!(e.target.closest && e.target.closest("#qaMenu"))) closeQaMenu(); }, true);

function closePops(){
  document.querySelectorAll(".pop").forEach(p=>p.classList.remove("open"));
  document.querySelectorAll(".filter-control").forEach(b=>b.setAttribute("aria-expanded","false"));
}
[["wkBtn","wkPop"],["agBtn","agPop"],["dpBtn","dpPop"],["crBtn","crPop"],["hoBtn","hoPop"],["chBtn","chPop"]].forEach(([b,p])=>{
  const btn=document.getElementById(b), pop=document.getElementById(p);
  btn.onclick = (e)=>{
    e.stopPropagation();
    const wasOpen = pop.classList.contains("open");
    closePops();
    if(!wasOpen){ pop.classList.add("open"); btn.setAttribute("aria-expanded","true"); }
  };
});
document.addEventListener("click", closePops);
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closePops(); });

load();
</script>
</body>
